<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Dados – Baixar vídeos grátis</title>
<meta name="description" content="Baixe vídeos do TikTok, Instagram Reels e Facebook de forma grátis e rápida. Cole o link e baixe.">
<meta name="theme-color" content="#0a0f24">
<style>
  :root {
    --bg: #0a0f24;
    --bg-2: #101845;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #f4f7ff;
    --muted: #a9b6dc;
    --accent: #3d7bff;
    --accent-2: #8a5cff;
    --accent-hover: #5e92ff;
    --ok: #35d49a;
    --error-bg: rgba(255, 80, 110, 0.12);
    --error-text: #ffb4c2;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    background-image:
      radial-gradient(700px 420px at 10% -5%, rgba(61, 123, 255, 0.35), transparent 70%),
      radial-gradient(700px 480px at 95% 10%, rgba(138, 92, 255, 0.28), transparent 70%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }

  .wrap { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 20px; }

  /* Cabeçalho */
  header { padding: 20px 0; }
  .header-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 1.3rem; font-weight: 800; letter-spacing: 0.2px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 800; font-size: 1.15rem;
    box-shadow: 0 8px 24px rgba(61, 123, 255, 0.4);
  }
  .brand .light { color: var(--accent-hover); }
  .badge {
    font-size: 0.8rem; color: var(--muted);
    border: 1px solid var(--card-border); border-radius: 999px;
    padding: 6px 12px; background: var(--card);
  }

  /* Principal */
  main { flex: 1; padding: 44px 0 30px; }

  .hero { text-align: center; }
  .hero h1 {
    font-size: clamp(2.1rem, 7vw, 3.4rem);
    line-height: 1.1; font-weight: 800; letter-spacing: -0.025em;
  }
  .hero h1 .grad {
    background: linear-gradient(90deg, var(--accent-hover), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { margin: 16px auto 0; color: var(--muted); font-size: 1.08rem; max-width: 34em; }

  /* Cartão do formulário */
  .panel {
    margin-top: 32px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }
  .form {
    display: flex; align-items: center; gap: 8px;
    background: rgba(5, 9, 30, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 16px; padding: 6px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61, 123, 255, 0.35); }
  .form input[type="url"] {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 1rem; padding: 14px 12px;
  }
  .form input::placeholder { color: #7f8fbf; }

  button {
    font-family: inherit; cursor: pointer; border: 0; border-radius: 12px;
    font-size: 1rem; font-weight: 700; padding: 14px 24px; color: #fff;
    transition: transform 0.1s, filter 0.15s, background 0.15s;
  }
  .btn-main { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .btn-main:hover { filter: brightness(1.12); }
  .btn-main:active { transform: scale(0.98); }
  .btn-ghost {
    background: rgba(255, 255, 255, 0.08); color: var(--muted);
    padding: 14px 16px; font-weight: 600; font-size: 0.92rem;
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.15); color: var(--text); }
  button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  button:disabled { opacity: 0.6; cursor: wait; }

  /* Seletor de qualidade */
  .quality { margin-top: 14px; padding: 0 4px; }
  .quality-label {
    font-size: 0.85rem; color: var(--muted); margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .quality-label svg { width: 16px; height: 16px; flex: none; }
